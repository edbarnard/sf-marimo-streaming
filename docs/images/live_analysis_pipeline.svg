<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgPipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="redTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="50%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="360" rx="14" fill="url(#bgPipe)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="500" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">
    Live Marimo Notebook Analysis Pipeline (Built Incrementally via LLM Pairing)
  </text>
  <text x="500" y="54" fill="#475569" font-size="12" text-anchor="middle">
    Each stage is a reactive Marimo cell that updates automatically as new frames arrive from ScopeFoundry
  </text>

  <!-- Panel 1: Red Channel Extraction (Cell bkHC) -->
  <rect x="28" y="76" width="290" height="258" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="173" y="100" fill="#b91c1c" font-size="13" font-weight="700" text-anchor="middle">
    Cell bkHC: Red Channel Viewer
  </text>
  <text x="173" y="116" fill="#475569" font-size="10.5" font-family="monospace" text-anchor="middle">
    red_channel = frame[:, :, 0]
  </text>

  <!-- Simulated Red Channel Image Canvas -->
  <rect x="48" y="128" width="250" height="140" rx="6" fill="url(#redTint)" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="145" cy="195" r="42" fill="#dc2626" fill-opacity="0.7" stroke="#991b1b" stroke-width="1.5"/>
  <circle cx="195" cy="185" r="24" fill="#ef4444" fill-opacity="0.85" stroke="#7f1d1d" stroke-width="1.2"/>
  <text x="173" y="256" fill="#7f1d1d" font-size="10" font-weight="600" font-family="monospace" text-anchor="middle">
    data:image/jpeg;base64 (Flicker-Free)
  </text>

  <text x="48" y="290" fill="#1e293b" font-size="11">• Modes: Red-tinted, Grayscale, Side-by-side</text>
  <text x="48" y="308" fill="#1e293b" font-size="11">• Live stats: Frame ID, Mean, Min / Max</text>
  <text x="48" y="324" fill="#b91c1c" font-size="10.5" font-weight="600" font-family="monospace">Outputs: frame, red_channel, meta</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="318" y1="205" x2="350" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- Panel 2: Edge Detection (Cell fXKi) -->
  <rect x="355" y="76" width="290" height="258" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="100" fill="#0e7490" font-size="13" font-weight="700" text-anchor="middle">
    Cell fXKi: Adaptive Edge Finding
  </text>
  <text x="500" y="116" fill="#475569" font-size="10.5" font-family="monospace" text-anchor="middle">
    GaussianBlur + Canny + Sobel
  </text>

  <!-- Simulated Edge Overlay Canvas -->
  <rect x="375" y="128" width="250" height="140" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="1.2"/>
  <circle cx="472" cy="195" r="42" fill="#fee2e2" fill-opacity="0.8" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6,2"/>
  <circle cx="522" cy="185" r="24" fill="#fecaca" fill-opacity="0.8" stroke="#0891b2" stroke-width="2"/>
  <text x="500" y="256" fill="#0e7490" font-size="10" font-weight="600" font-family="monospace" text-anchor="middle">
    Canny + Sobel + Cyan Edge Overlay
  </text>

  <text x="375" y="290" fill="#1e293b" font-size="11">• Median-based auto Canny thresholds</text>
  <text x="375" y="308" fill="#1e293b" font-size="11">• Continuous Sobel gradient magnitude</text>
  <text x="375" y="324" fill="#0e7490" font-size="10.5" font-weight="600" font-family="monospace">Metrics: Edge Pixels %, Mean Gradient</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="645" y1="205" x2="677" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- Panel 3: Live SVG Histogram (Cell dblj) -->
  <rect x="682" y="76" width="290" height="258" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="827" y="100" fill="#b45309" font-size="13" font-weight="700" text-anchor="middle">
    Cell dblj: 256-Bin SVG Histogram
  </text>
  <text x="827" y="116" fill="#475569" font-size="10.5" font-family="monospace" text-anchor="middle">
    np.bincount(red_channel.ravel())
  </text>

  <!-- Simulated Histogram SVG Canvas -->
  <rect x="702" y="128" width="250" height="140" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- Grid lines -->
  <line x1="752" y1="136" x2="752" y2="246" stroke="#e2e8f0" stroke-dasharray="2,2"/>
  <line x1="827" y1="136" x2="827" y2="246" stroke="#e2e8f0" stroke-dasharray="2,2"/>
  <line x1="902" y1="136" x2="902" y2="246" stroke="#e2e8f0" stroke-dasharray="2,2"/>
  <!-- Green & Blue reference curves -->
  <polyline fill="none" stroke="#16a34a" stroke-width="1.3" stroke-opacity="0.65" points="712,244 740,235 775,195 810,175 845,205 885,232 940,244"/>
  <polyline fill="none" stroke="#2563eb" stroke-width="1.3" stroke-opacity="0.65" points="712,244 735,220 765,180 800,190 840,220 890,238 940,244"/>
  <!-- Red channel filled curve -->
  <polygon fill="#ef4444" fill-opacity="0.25" points="712,244 712,244 745,230 780,190 818,148 852,165 890,215 925,238 940,244 940,244"/>
  <polyline fill="none" stroke="#dc2626" stroke-width="2" points="712,244 745,230 780,190 818,148 852,165 890,215 925,238 940,244"/>
  <!-- Median line -->
  <line x1="822" y1="136" x2="822" y2="246" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,2"/>
  <text x="826" y="148" fill="#b45309" font-size="9.5" font-weight="600" font-family="monospace">median=134</text>

  <text x="702" y="290" fill="#1e293b" font-size="11">• Vector SVG via mo.Html (sub-ms update)</text>
  <text x="702" y="308" fill="#1e293b" font-size="11">• Red distribution + G/B reference curves</text>
  <text x="702" y="324" fill="#b45309" font-size="10.5" font-weight="600" font-family="monospace">Metrics: P10, P50 (Median), P90, Std</text>
</svg>
