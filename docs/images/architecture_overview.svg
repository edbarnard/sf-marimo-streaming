<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 440" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="sfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="moGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="440" rx="14" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="530" y="36" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">
    Real-Time Instrument Streaming &amp; Live LLM-Assisted Data Analysis
  </text>
  <text x="530" y="56" fill="#475569" font-size="12.5" text-anchor="middle">
    Decoupling hardware control (ScopeFoundry) from hot-editable reactive analysis (Marimo + LLM Code Mode)
  </text>

  <!-- 1. ScopeFoundry Box -->
  <rect x="30" y="82" width="280" height="245" rx="10" fill="url(#sfGrad)" stroke="#2563eb" stroke-width="1.8"/>
  <text x="170" y="108" fill="#1e40af" font-size="14" font-weight="700" text-anchor="middle">1. ScopeFoundry Instrument</text>
  <text x="170" y="125" fill="#1d4ed8" font-size="11" font-family="monospace" text-anchor="middle">main.py (WebcamStreamApp)</text>

  <!-- WebcamZmqHW card -->
  <rect x="48" y="140" width="244" height="82" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="60" y="160" fill="#0f172a" font-size="12" font-weight="700">WebcamZmqHW (Hardware)</text>
  <text x="60" y="178" fill="#334155" font-size="11">• OpenCV VideoCapture thread</text>
  <text x="60" y="194" fill="#334155" font-size="11">• LoggedQuantities (FPS, RGB, HWM)</text>
  <text x="60" y="210" fill="#0369a1" font-size="11" font-weight="600" font-family="monospace">• zmq.PUB (tcp://*:5556)</text>

  <!-- WebcamLiveMeasure card -->
  <rect x="48" y="234" width="244" height="76" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="60" y="254" fill="#0f172a" font-size="12" font-weight="700">WebcamLiveMeasure (GUI)</text>
  <text x="60" y="272" fill="#334155" font-size="11">• Local PyQtGraph live preview</text>
  <text x="60" y="288" fill="#334155" font-size="11">• Instant HDF5 snapshots (snap_h5)</text>

  <!-- ZMQ Stream Arrow -->
  <line x1="310" y1="180" x2="430" y2="180" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="320" y="132" width="100" height="38" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="370" y="148" fill="#0369a1" font-size="10.5" font-weight="700" text-anchor="middle">ZeroMQ PUB/SUB</text>
  <text x="370" y="162" fill="#334155" font-size="9.5" font-family="monospace" text-anchor="middle">[topic, meta, buf]</text>

  <!-- 2. Marimo Reactive Notebook Box -->
  <rect x="438" y="82" width="312" height="245" rx="10" fill="url(#moGrad)" stroke="#059669" stroke-width="1.8"/>
  <text x="594" y="108" fill="#065f46" font-size="14" font-weight="700" text-anchor="middle">2. Reactive Marimo Notebook</text>
  <text x="594" y="125" fill="#047857" font-size="11" font-family="monospace" text-anchor="middle">red_channel_viewer.py (:2719)</text>

  <!-- DAG nodes inside Marimo -->
  <rect x="456" y="140" width="276" height="44" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="468" y="158" fill="#0f172a" font-size="11.5" font-weight="700">Cell vblA + bkHC: ZMQ Drain &amp; Red Channel</text>
  <text x="468" y="174" fill="#047857" font-size="10.5" font-family="monospace">recv_latest_frame() → red_channel, meta</text>

  <rect x="456" y="196" width="132" height="58" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="522" y="215" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Cell fXKi: Edges</text>
  <text x="522" y="231" fill="#334155" font-size="10" text-anchor="middle">Canny + Sobel</text>
  <text x="522" y="245" fill="#334155" font-size="10" text-anchor="middle">+ Cyan Overlay</text>

  <rect x="600" y="196" width="132" height="58" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="666" y="215" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Cell dblj: Histogram</text>
  <text x="666" y="231" fill="#334155" font-size="10" text-anchor="middle">256-Bin Vector SVG</text>
  <text x="666" y="245" fill="#334155" font-size="10" text-anchor="middle">P10 / P50 / P90</text>

  <rect x="456" y="266" width="276" height="44" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="594" y="285" fill="#b45309" font-size="11.5" font-weight="700" text-anchor="middle">Live Browser UI (0.5s Poll, Flicker-Free)</text>
  <text x="594" y="301" fill="#334155" font-size="10.5" text-anchor="middle">Real-time visual feedback while instrument runs</text>

  <!-- 3. LLM Co-Pilot Box -->
  <rect x="800" y="82" width="230" height="245" rx="10" fill="url(#llmGrad)" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="915" y="108" fill="#5b21b6" font-size="14" font-weight="700" text-anchor="middle">3. Live LLM Agent</text>
  <text x="915" y="125" fill="#6d28d9" font-size="11" font-family="monospace" text-anchor="middle">marimo-pair Skill</text>

  <rect x="816" y="140" width="198" height="170" rx="7" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
  <text x="828" y="162" fill="#0f172a" font-size="11.5" font-weight="700">marimo._code_mode (cm)</text>
  <text x="828" y="182" fill="#334155" font-size="10.5">• Inspects live kernel globals</text>
  <text x="828" y="200" fill="#334155" font-size="10.5">• Reads cell code &amp; errors</text>
  <text x="828" y="218" fill="#334155" font-size="10.5">• Hot-inserts &amp; edits cells</text>
  <text x="828" y="236" fill="#334155" font-size="10.5">• Validates DAG (no cycles)</text>
  <text x="828" y="254" fill="#334155" font-size="10.5">• Executes cells in-place</text>
  <text x="828" y="272" fill="#5b21b6" font-size="10.5" font-weight="700">• Auto-saves .py to disk</text>
  <text x="828" y="294" fill="#6d28d9" font-size="10" font-family="monospace">ctx.create_cell / run_cell</text>

  <!-- Bidirectional arrow between Marimo and LLM -->
  <line x1="798" y1="190" x2="754" y2="190" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <line x1="754" y1="215" x2="798" y2="215" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Scientist / User Decision Loop Bar at Bottom -->
  <rect x="30" y="352" width="1000" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="530" y="376" fill="#b45309" font-size="13.5" font-weight="700" text-anchor="middle">
    Scientist-in-the-Loop Experimental Decision Cycle
  </text>
  <text x="530" y="398" fill="#1e293b" font-size="12" text-anchor="middle">
    Observe live stream in Marimo  ➔  Ask LLM in plain English for new analysis/metrics  ➔  Cells hot-update live  ➔  Adjust instrument parameters
  </text>

  <!-- Arrows connecting bottom bar -->
  <line x1="594" y1="327" x2="594" y2="350" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="915" y1="350" x2="915" y2="329" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="170" y1="350" x2="170" y2="329" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
</svg>
