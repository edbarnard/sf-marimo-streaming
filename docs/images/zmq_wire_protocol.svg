<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgWire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1000" height="310" rx="14" fill="url(#bgWire)" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="500" y="34" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">
    ZeroMQ Multipart Frame Protocol &amp; Latest-Frame Queue Draining
  </text>
  <text x="500" y="54" fill="#475569" font-size="12" text-anchor="middle">
    Zero-copy numpy buffer transport with sub-millisecond queue draining for lag-free polling
  </text>

  <!-- Multipart Message Frame Box -->
  <rect x="30" y="76" width="550" height="205" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="305" y="100" fill="#0369a1" font-size="13.5" font-weight="700" text-anchor="middle">
    3-Part ZMQ Multipart Message (send_multipart(..., copy=False))
  </text>

  <!-- Part 0: Topic -->
  <rect x="48" y="116" width="120" height="145" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="108" y="138" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle">Part 0: Topic</text>
  <text x="108" y="160" fill="#0f172a" font-size="11" font-weight="600" font-family="monospace" text-anchor="middle">b"frame"</text>
  <text x="108" y="190" fill="#475569" font-size="10.5" text-anchor="middle">UTF-8 prefix for</text>
  <text x="108" y="206" fill="#475569" font-size="10.5" text-anchor="middle">ZMQ_SUBSCRIBE</text>
  <text x="108" y="222" fill="#475569" font-size="10.5" text-anchor="middle">topic filtering</text>

  <!-- Part 1: JSON Header -->
  <rect x="182" y="116" width="196" height="145" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="280" y="138" fill="#b45309" font-size="12" font-weight="700" text-anchor="middle">Part 1: JSON Metadata</text>
  <text x="196" y="160" fill="#334155" font-size="10.5" font-family="monospace">{</text>
  <text x="206" y="176" fill="#047857" font-size="10.5" font-family="monospace">"frame_id": 1420,</text>
  <text x="206" y="192" fill="#047857" font-size="10.5" font-family="monospace">"timestamp": 1762978.4,</text>
  <text x="206" y="208" fill="#047857" font-size="10.5" font-family="monospace">"dtype": "uint8",</text>
  <text x="206" y="224" fill="#047857" font-size="10.5" font-family="monospace">"shape": [480, 640, 3],</text>
  <text x="206" y="240" fill="#047857" font-size="10.5" font-family="monospace">"color_mode": "RGB"</text>
  <text x="196" y="254" fill="#334155" font-size="10.5" font-family="monospace">}</text>

  <!-- Part 2: Raw Numpy Buffer -->
  <rect x="392" y="116" width="170" height="145" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="477" y="138" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle">Part 2: Raw Array</text>
  <text x="477" y="162" fill="#0f172a" font-size="10.5" font-weight="600" font-family="monospace" text-anchor="middle">memoryview / bytes</text>
  <text x="477" y="186" fill="#334155" font-size="10.5" text-anchor="middle">C-contiguous ndarray</text>
  <text x="477" y="204" fill="#334155" font-size="10.5" text-anchor="middle">Reconstructed via:</text>
  <text x="477" y="224" fill="#b91c1c" font-size="10" font-family="monospace" text-anchor="middle">np.frombuffer(buf,</text>
  <text x="477" y="240" fill="#b91c1c" font-size="10" font-family="monospace" text-anchor="middle">dtype).reshape(shape)</text>

  <!-- Arrow to Subscriber Drain -->
  <line x1="580" y1="178" x2="625" y2="178" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Subscriber Queue Drain Box -->
  <rect x="632" y="76" width="338" height="205" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="801" y="100" fill="#065f46" font-size="13.5" font-weight="700" text-anchor="middle">
    Low-Latency Subscriber Drain
  </text>
  <text x="801" y="118" fill="#047857" font-size="11" font-family="monospace" text-anchor="middle">
    zmq_sub_client.recv_latest_frame()
  </text>

  <!-- FIFO queue visual -->
  <rect x="652" y="132" width="58" height="36" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,2"/>
  <text x="681" y="154" fill="#64748b" font-size="10" text-anchor="middle">Frame N-2</text>
  <text x="681" y="182" fill="#64748b" font-size="9.5" text-anchor="middle">skipped</text>

  <rect x="720" y="132" width="58" height="36" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,2"/>
  <text x="749" y="154" fill="#64748b" font-size="10" text-anchor="middle">Frame N-1</text>
  <text x="749" y="182" fill="#64748b" font-size="9.5" text-anchor="middle">skipped</text>

  <rect x="788" y="132" width="66" height="36" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="821" y="154" fill="#065f46" font-size="10.5" font-weight="700" text-anchor="middle">Frame N</text>
  <text x="821" y="182" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">decoded!</text>

  <text x="652" y="210" fill="#1e293b" font-size="11">• Avoids ZMQ HWM tail-drop of fresh frames</text>
  <text x="652" y="230" fill="#1e293b" font-size="11">• Drains queued raw parts with NOBLOCK</text>
  <text x="652" y="250" fill="#1e293b" font-size="11">• Parses JSON &amp; reshapes only the newest</text>
  <text x="652" y="268" fill="#1e293b" font-size="11">  frame on each 0.5s Marimo poll tick</text>
</svg>
